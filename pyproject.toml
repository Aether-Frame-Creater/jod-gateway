[project]
name = "jod-gateway"
version = "0.0.1"
description = "JOD Gateway — a lightweight payment gateway service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "sse-starlette",
    "aiosqlite",
    "cryptography",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jod_gateway"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"